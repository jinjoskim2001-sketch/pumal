<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>shell demo</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="../css/app.css">
<style>
  /* harness-only read-out, never part of the app */
  #demoInfo {
    position: absolute; left: 6px; bottom: 4px; z-index: 99; margin: 0;
    font: 10px/1.3 ui-monospace, Menlo, monospace; color: #9fe8b0; white-space: pre;
    pointer-events: none;
  }
</style>
</head>
<body>
<!--
  Throwaway harness for the device shell and js/lcd.js. It needs no game code.
  The body markup is copied from ../index.html at load time, so it can never drift.

  Query:
    skin=milk|grape|graphite|ice|lagoon|sakura     colourway (default milk)
    tint=pea|warm|amber|glow                       LCD tint (default pea)
    solid=1                                        opaque fallback for translucent skins
    backdrop=day|dusk|night|none                   printed backdrop (default day)
    sel=0..7|-1                                    selected icon (default 1)
    lit=7,2                                        lit icons (default 7)
    caption=...                                    caption text
    press=A|B|C                                    show a key held down
    toast=...                                      show a toast
    anim=1                                         flip the idle frame every 500 ms with ghosting
    scene=clock|blank|full                         other test pictures
    debug=1                                        print pitch, sizes and hitTest self-checks
    vp=390x844                                     render inside an iframe of exactly this size
                                                   (needed for screenshots narrower than 500 px)
    page=../index.html%3Fplay%3D1                  with vp: frame another project page instead
-->
<script type="module">
import { createLCD, COLS, ROWS } from '../js/lcd.js';
import { ANCHOR } from '../js/art/anchor.js';

const q = new URLSearchParams(location.search);

// collected for the debug read-out, since a headless screenshot has no console to look at
const errors = [];
addEventListener('error', (e) => errors.push(e.message || String(e)));
addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));

// ---- exact-viewport mode ----
// Headless Chrome refuses windows narrower than 500 CSS px, so a "390 wide" screenshot is
// really laid out at 500 and cropped. With vp=WxH this page only hosts an iframe of exactly
// that size in the top-left corner; inside it the viewport units are true. page= frames any
// other project page (relative to this file) the same way.
const vp = /^(\d+)x(\d+)$/.exec(q.get('vp') || '');
if (vp) {
  const inner = new URLSearchParams(q);
  inner.delete('vp');
  inner.delete('page');
  const frame = document.createElement('iframe');
  frame.src = q.get('page') || `${location.pathname}?${inner}`;
  frame.style.cssText = `position:absolute;left:0;top:0;width:${vp[1]}px;height:${vp[2]}px;border:0;background:#101114`;
  document.body.appendChild(frame);
} else {
  await main();
}

async function main() {
// ---- copy the real body ----
const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
const doc = new DOMParser().parseFromString(html, 'text/html');
let shellScript = '';
for (const node of [...doc.body.children]) {
  if (node.tagName === 'SCRIPT') {
    if (!node.type && !node.src) shellScript = node.textContent;   // the inline shell-feel script
    continue;
  }
  document.body.appendChild(document.importNode(node, true));
}
if (shellScript) {
  const s = document.createElement('script');
  s.textContent = shellScript;
  document.body.appendChild(s);
}

const device = document.getElementById('device');
device.dataset.skin = q.get('skin') || 'milk';
if (q.get('solid') === '1') device.dataset.solid = 'true';

// ---- placeholder art (the real icons and fonts come from js/art/ui.js) ----
const ICON = {
  bowl: [
    '....#..#....',
    '...#..#.....',
    '....#..#....',
    '............',
    '############',
    '#..........#',
    '.#........#.',
    '.##......##.',
    '..########..',
    '...######...',
  ],
  ball: [
    '....####....',
    '..##....##..',
    '.#...##...#.',
    '.#..####..#.',
    '#..######..#',
    '#...####...#',
    '.#..#..#..#.',
    '.#........#.',
    '..##....##..',
    '....####....',
  ],
  drop: [
    '.....#....#.',
    '....###..###',
    '....###...#.',
    '...#####....',
    '..#######...',
    '..#######...',
    '..#######...',
    '..#######...',
    '...#####....',
    '....###.....',
  ],
  bulb: [
    '....####....',
    '...#....#...',
    '..#......#..',
    '..#......#..',
    '..#......#..',
    '...#....#...',
    '....#..#....',
    '....####....',
    '....####....',
    '.....##.....',
  ],
  pill: [
    '............',
    '.......###..',
    '......#####.',
    '.....#######',
    '....#..####.',
    '...#....##..',
    '..#......#..',
    '.#......#...',
    '.#.....#....',
    '..#####.....',
  ],
  horn: [
    '.........#..',
    '.......###.#',
    '.....#####..',
    '.#########.#',
    '.#########..',
    '.#########.#',
    '.....#####..',
    '..##...###.#',
    '..##.....#..',
    '............',
  ],
  book: [
    '.##########.',
    '.#.#......#.',
    '.#.#.#..#.#.',
    '.#.#.####.#.',
    '.#.#.####.#.',
    '.#.#..##..#.',
    '.#.#......#.',
    '.#.#......#.',
    '.##########.',
    '............',
  ],
  bang: [
    '..########..',
    '.#........#.',
    '#....##....#',
    '#....##....#',
    '#....##....#',
    '#..........#',
    '#....##....#',
    '.#........#.',
    '..###.####..',
    '....#.......',
  ],
};

const FONT = {
  '0': ['###', '#.#', '#.#', '#.#', '###'],
  '1': ['.#.', '##.', '.#.', '.#.', '###'],
  '2': ['###', '..#', '###', '#..', '###'],
  '3': ['###', '..#', '###', '..#', '###'],
  '4': ['#.#', '#.#', '###', '..#', '..#'],
  '5': ['###', '#..', '###', '..#', '###'],
  ':': ['.', '#', '.', '#', '.'],
  ' ': ['...', '...', '...', '...', '...'],
};

const HEART = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
const PILE = ['..#.....', '...#....', '..###...', '.#####..', '.#####..', '#######.', '#######.', '........'];

// ---- LCD ----
const canvas = document.getElementById('lcd');
const lcd = createLCD(canvas);
lcd.setTint(q.get('tint') || 'pea');
const backdrop = q.get('backdrop') || 'day';
lcd.setBackdrop(backdrop === 'none' ? null : backdrop);
lcd.setIcons([ICON.bowl, ICON.ball, ICON.drop, ICON.bulb], [ICON.pill, ICON.horn, ICON.book, ICON.bang]);
const sel = q.has('sel') ? Number(q.get('sel')) : 1;
const lit = (q.get('lit') ?? '7').split(',').filter(Boolean).map(Number);
lcd.setIconState({ selected: sel, lit });

const scene = q.get('scene') || 'idle';
function draw(frame) {
  lcd.clear();
  if (scene === 'blank') return;
  if (scene === 'full') { lcd.rect(0, 0, COLS, ROWS); return; }
  if (scene === 'clock') {
    lcd.frame(6, 6, 36, 20);
    lcd.text('12:34', 15, 13, FONT);
    return;
  }
  lcd.sprite(ANCHOR.idle[frame % 2], 15 + (frame % 2), 16);
  lcd.sprite(ANCHOR.idle[1], 0, 16, { flipX: true, invert: false });
  lcd.sprite(PILE, 38, 24);
  lcd.sprite(HEART, 2, 1);
  lcd.sprite(HEART, 10, 1);
  const end = lcd.text('12:34', 28, 1, FONT);
  lcd.dot(end + 1, 5);
  lcd.rect(34, 12, 6, 4);
  lcd.sprite(['#.#', '.#.', '#.#'], 35, 12, { invert: true });
}

let frame = 0;
draw(frame);
lcd.snap();
if (q.get('anim') === '1') {
  setInterval(() => { frame += 1; draw(frame); lcd.present(); }, 500);
}

document.getElementById('caption').textContent = q.get('caption') ?? '몽실이 · 3살';

const press = q.get('press');
if (press) document.getElementById(`key${press.toUpperCase()}`)?.classList.add('is-pressed');

if (q.get('toast')) {
  const t = document.createElement('div');
  t.textContent = q.get('toast');
  document.getElementById('toastRoot').appendChild(t);
}

// ---- self-checks ----
if (q.get('debug') === '1') {
  const info = document.createElement('pre');
  info.id = 'demoInfo';
  document.body.appendChild(info);
  const report = () => {
    const r = canvas.getBoundingClientRect();
    const p = lcd.pitch;
    const at = (u, v) => lcd.hitTest(r.left + u * p, r.top + v * p);
    const fmt = (h) => (h ? (h.zone === 'icon' ? `icon${h.index}` : `m(${h.x},${h.y})`) : 'null');
    const d = document.getElementById('device').getBoundingClientRect();
    info.textContent = [
      `vp ${innerWidth}x${innerHeight} dpr ${devicePixelRatio}`,
      `pitch ${p}  css ${r.width}x${r.height}  store ${canvas.width}x${canvas.height}`,
      `device ${d.width.toFixed(1)}x${d.height.toFixed(1)} @ ${d.left.toFixed(1)},${d.top.toFixed(1)}`,
      // expected: icon0 icon3 icon4 icon7 | m(0,0) m(47,31) m(10,5) | null
      `hit ${fmt(at(2, 3))} ${fmt(at(48, 5))} ${fmt(at(7, 45))} ${fmt(at(44, 46))} | ${fmt(at(1.5, 9.5))} ${fmt(at(48.5, 40.5))} ${fmt(at(11.5, 14.5))} | ${fmt(lcd.hitTest(r.left - 3, r.top + 20))}`,
      `errors ${errors.length}${errors.length ? ': ' + errors.join(' | ') : ''}`,
    ].join('\n');
  };
  report();
  setTimeout(report, 1200);                 // again once the shell script and a few frames have run
  addEventListener('resize', () => requestAnimationFrame(report));
}

window.__lcd = lcd;
}
</script>
</body>
</html>
