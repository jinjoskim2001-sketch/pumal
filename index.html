<script>
// The installed app is laid out from 100vh, a browser tab from the dynamic viewport
// (css/app.css, --vh). CSS sees the installed app through the display-mode media feature;
// this adds the older iOS signal so that app can never be mistaken for a tab.
if (navigator.standalone === true) document.documentElement.setAttribute('data-display', 'standalone');
</script>

            <path d="M84 132V100L104 80H232V62"/>
            <path d="M96 134V104L112 88H244V62"/>
            <path d="M286 132V96L256 66V62"/>
            <path d="M274 134V100L250 76V62"/>
            <path d="M177 156V142M193 156V142"/>
            <path d="M32 204V122L44 110V66"/>
            <path d="M338 204V122L326 110V66"/>

          <!-- coin cell in its clip -->

        <span class="key-cap" aria-hidden="true"><svg viewBox="0 0 5 7" focusable="false"><path d="M0 0h4v1H0zM0 1h1v6H0zM4 1h1v2H4zM1 3h3v1H1zM4 4h1v2H4zM1 6h3v1H1z"/></svg></span>
        <span class="key-label" aria-hidden="true">결정</span>
      </div>

        <span class="key-cap" aria-hidden="true"><svg viewBox="0 0 5 7" focusable="false"><path d="M1 0h4v1H1zM0 1h1v5H0zM1 6h4v1H1z"/></svg></span>

<div id="sheetRoot"></div>

<div id="toastRoot"></div>

<script>
// Shell feel: key press look, glare that follows the pointer, pinch guards.
// Inline and classic on purpose: the toy must answer a touch in the same frame, even while
// the game modules are still loading. It only toggles classes and transforms; what a key
// DOES is wired in js/main.js.
(function () {
  var device = document.getElementById('device');
  if (!device) return;

  // --- keys: down within the frame of the touch, held long enough to be seen ---
  var keys = Array.prototype.slice.call(device.querySelectorAll('.key'));
  var MIN_PRESS_MS = 90;

  function release(key) {
    key._pid = null;
    clearTimeout(key._timer);
    var wait = MIN_PRESS_MS - (performance.now() - (key._t || 0));
    if (wait > 0) {
      key._timer = setTimeout(function () { key.classList.remove('is-pressed'); }, wait);
    } else {
      key.classList.remove('is-pressed');
    }
  }

  keys.forEach(function (key) {
    key.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      clearTimeout(key._timer);
      key._pid = e.pointerId;
      key._t = performance.now();
      key.classList.add('is-pressed');
    }, { passive: true });
  });

  function onPointerEnd(e) {
    keys.forEach(function (key) {
      if (key._pid === e.pointerId) release(key);
    });
  }

  function releaseAll() {
    keys.forEach(function (key) {
      if (key._pid != null) release(key);
    });
  }

  window.addEventListener('pointerup', onPointerEnd, { passive: true });
  window.addEventListener('pointercancel', onPointerEnd, { passive: true });
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', releaseAll);

  // --- glare: the reflections drift a few px toward the finger, low-pass filtered ---
  var glare = device.querySelector('.glare');
  var sheen = device.querySelector('.sheen');
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)');
  var box = null;
  var tx = 0, ty = 0, x = 0, y = 0, raf = 0;

  function paint() {
    if (glare) glare.style.transform = 'translate3d(' + (x * 10).toFixed(2) + 'px,' + (y * 8).toFixed(2) + 'px,0)';
    if (sheen) sheen.style.transform = 'translate3d(' + (x * 7).toFixed(2) + 'px,' + (y * 6).toFixed(2) + 'px,0)';
  }

  function step() {
    x += (tx - x) * 0.14;
    y += (ty - y) * 0.14;
    var settled = Math.abs(tx - x) < 0.004 && Math.abs(ty - y) < 0.004;
    if (settled) { x = tx; y = ty; }
    paint();
    raf = settled ? 0 : requestAnimationFrame(step);
  }

  function aim(e) {
    if (calm.matches) return;
    if (!box) box = device.getBoundingClientRect();
    if (!box.width || !box.height) return;
    tx = Math.max(-1, Math.min(1, ((e.clientX - box.left) / box.width) * 2 - 1));
    ty = Math.max(-1, Math.min(1, ((e.clientY - box.top) / box.height) * 2 - 1));
    if (!raf) raf = requestAnimationFrame(step);
  }

  function rest() {
    tx = 0; ty = 0;
    if (calm.matches) { x = 0; y = 0; paint(); return; }
    if (!raf) raf = requestAnimationFrame(step);
  }

  window.addEventListener('pointermove', aim, { passive: true });
  window.addEventListener('pointerdown', aim, { passive: true });
  window.addEventListener('pointerup', function (e) { if (e.pointerType !== 'mouse') rest(); }, { passive: true });
  window.addEventListener('pointercancel', rest, { passive: true });
  document.documentElement.addEventListener('mouseleave', rest);
  window.addEventListener('resize', function () { box = null; });
  if (calm.addEventListener) calm.addEventListener('change', rest);

  // --- guards: Safari ignores user-scalable=no in a tab, so stop the pinch by hand ---
  function block(e) { e.preventDefault(); }
  document.addEventListener('gesturestart', block, { passive: false });
  document.addEventListener('gesturechange', block, { passive: false });
  var stage = document.getElementById('stage');
  if (stage) stage.addEventListener('contextmenu', block);
  // an (empty) touchstart listener is what makes :active styles apply on iOS
  document.addEventListener('touchstart', function () {}, { passive: true });
})();
</script>
<script type="module" src="js/main.js"></script>
<script>
// Load watchdog. The game, the install guide and every message live behind js/main.js and
// its imports. If one of those files cannot be fetched, nothing ever runs and the page would
// stay a toy with a blank screen and dead keys, with no way to reload in the installed app.
// - `error` on the script element fires when main.js or any module it imports fails to load.
// - A request that just hangs fires nothing, so a timer covers it. That notice goes away by
//   itself if the modules do arrive (`load` fires once main.js has run).
// This script runs while the page is still being parsed, before either event can fire.
(function () {
  var script = document.querySelector('script[type="module"][src="js/main.js"]');
  var root = document.getElementById('gateRoot');
  if (!script || !root) return;
  var SLOW_MS = 12000;
  var notice = null;

  function hide() {
    if (notice && notice.parentNode) notice.parentNode.removeChild(notice);
    notice = null;
  }

  function show(failed) {
    hide();
    notice = document.createElement('section');
    notice.className = 'gate gate--notice';
    notice.setAttribute('role', 'alert');
    notice.innerHTML =
      '<div class="gate__inner"><header class="gate__head">' +
      '<p class="gate__headline">' + (failed ? '불러오지 못했어요' : '불러오는 중이에요') + '</p>' +
      '<p class="gate__lead">' + (failed
        ? '연결을 확인하고<br>다시 시도해 주세요.'
        : '연결이 느린 것 같아요.<br>조금 더 기다리거나 다시 시도해 주세요.') + '</p>' +
      '</header><button type="button" class="gate-btn gate-btn--primary">다시 시도</button></div>';
    notice.querySelector('button').addEventListener('click', function () { location.reload(); });
    root.appendChild(notice);
    // Also on the toy itself, in case the notice cannot be drawn.
    var caption = document.getElementById('caption');
    if (failed && caption && !caption.textContent) caption.textContent = '불러오지 못했어요';
  }

  var timer = setTimeout(function () { show(false); }, SLOW_MS);
  script.addEventListener('load', function () { clearTimeout(timer); hide(); });
  script.addEventListener('error', function () { clearTimeout(timer); show(true); });
})();
</script>
</body>
